[project]
name = "chordcraft-backend"
version = "0.1.0"
description = "ChordCraft AI backend — theory engine, FastAPI service, and (soon) the chord model + LLM copilot"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# Model training + inference. Linux installs pull CPU wheels (see [tool.uv.sources]);
# GPU training happens on Modal, which builds its own CUDA image.
ml = ["torch>=2.5", "numpy>=2.0", "safetensors>=0.4", "huggingface_hub>=0.26"]

[dependency-groups]
# ONNX export for in-browser inference (python -m chordcraft.model.onnx_export).
export = ["onnx>=1.17", "onnxruntime>=1.20", "onnxscript>=0.2"]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chordcraft"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
